[package]
name = "phigrauth"
version = "0.1.1"
edition = "2021"
description = "PhigrAuth — a TTY greeter / session manager"
license = "GPL-2.0-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
usvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
tiny-skia = "0.11.4"
pam = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
fontdb = "0.23"
cairo-rs = { version = "0.20", features = ["png"] }
serde_json = "1"
